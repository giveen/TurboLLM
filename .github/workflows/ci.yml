name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck & Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: turbollm/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: turbollm

      - name: Typecheck
        run: npm run typecheck
        working-directory: turbollm

      - name: Unit tests
        run: npm test
        working-directory: turbollm

  # Windows parity. The engine installers take a different branch on Windows (PowerShell
  # Expand-Archive instead of tar, `llama-server.exe`, a separate CUDA runtime pack), and until
  # this job existed none of that had ever been executed by CI — the win32-only tests were
  # simply skipped on the ubuntu runner, which is how a Windows-only regression reached review.
  #
  # continue-on-error: the suite has only ever run on Linux; landing it non-blocking first means
  # it can be seen green (and any platform-specific failures fixed) before it gates PRs. Remove
  # this line once the job is reliably green.
  test-windows:
    name: Typecheck & Unit tests (Windows)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: turbollm/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: turbollm

      - name: Typecheck
        run: npm run typecheck
        working-directory: turbollm

      - name: Unit tests
        run: npm test
        working-directory: turbollm

  wrapper:
    name: Desktop wrapper unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
        working-directory: wrapper

  # NOTE: the standalone "telemetry-schema-hash" PR/push gate that used to live
  # here (ADR-331/333) was retired once `scripts/release.mjs`'s `preflight`
  # phase started enforcing the same check itself, with `--approved` able to
  # redeploy the Worker on the spot (see scripts/release.mjs). Duplicating the
  # gate on every ordinary PR to main added noise without adding safety: the
  # moment that actually matters is publish, and `preflight`/`publish` now
  # refuse to proceed on a schema/Worker mismatch. See docs/RELEASE.md.
